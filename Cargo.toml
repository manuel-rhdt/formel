[package]
name = "math-render"
version = "0.1.0"
authors = ["Manuel Reinhardt <manuel.jr16@gmail.com>"]
build = "build.rs"
edition = "2024"
rust-version = "1.85"

[dependencies]
quick-xml = { version = "0.42", optional = true }
rustybuzz = "0.20"
bitflags = "2"
svg = { version = "0.18", optional = true }

[build-dependencies]
serde = "1.0.110"
serde_json = "1.0.53"

[[example]]
name = "render_svg"
required-features = ["mathml_parser", "svg"]

[features]
# default = ["mathml_parser"]
mathml_parser = ["quick-xml"]
# SVG output of laid-out documents (`svg_renderer`)
svg = ["dep:svg"]

[workspace]
members = ["mathimg", "mathwasm"]
