[package]
name = "formel"
version = "0.1.0"
authors = ["Manuel Reinhardt <manuel.jr16@gmail.com>"]
description = "Lay out mathematical formulas from MathML with a font's OpenType MATH table"
license = "MIT"
repository = "https://github.com/manuel-rhdt/formel"
readme = "README.md"
keywords = ["mathml", "typesetting", "math", "formula", "svg"]
categories = ["text-processing", "graphics", "wasm"]
build = "build.rs"
edition = "2024"
rust-version = "1.85"
# The web demo (with its fonts), the README images and the CI configuration are not part of the library.
exclude = ["web/", "docs/", ".github/"]

[dependencies]
quick-xml = { version = "0.42", optional = true }
rustybuzz = "0.20"
bitflags = "2"
svg = { version = "0.18", optional = true }

[dev-dependencies]
quickcheck = { version = "1", default-features = false }

[build-dependencies]
serde = "1.0.110"
serde_json = "1.0.53"

[[example]]
name = "render_svg"
required-features = ["mathml_parser", "svg"]

[features]
# default = ["mathml_parser"]
mathml_parser = ["quick-xml"]
# SVG output of laid-out documents (`svg_renderer`)
svg = ["dep:svg"]

# Size over speed: the module is what the demo downloads. `panic = "abort"` also needs no unwinding
# tables; `strip` drops the `name` section (keep a debug build if you need symbolised panics).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["mathimg", "formel-wasm"]
