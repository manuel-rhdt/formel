[package]
name = "mathwasm"
version = "0.1.0"
authors = ["Manuel Reinhardt <manuel.jr16@gmail.com>"]
edition = "2024"
rust-version = "1.96"
description = "WebAssembly bindings: render MathML to SVG in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
math-render = { path = "..", version = "0.1.0", features = ["mathml_parser", "svg"] }
wasm-bindgen = "=0.2.100"
math-core = "0.9"
