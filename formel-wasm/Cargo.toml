[package]
name = "formel-wasm"
version = "0.2.1"
authors = ["Manuel Reinhardt <manuel.jr16@gmail.com>"]
edition = "2024"
rust-version = "1.96"
description = "WebAssembly bindings: render MathML to SVG in the browser"
license = "MIT"
repository = "https://github.com/manuel-rhdt/formel"
# The npm package is assembled by `.github/workflows/npm.yml`, not by `cargo package`.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
formel = { path = "..", version = "0.2.1", features = ["mathml_parser", "svg"] }
wasm-bindgen = "=0.2.100"
math-core = "0.9"
