<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>math-render in the browser</title>
<style>
  :root { color-scheme: light dark; --gap: 1rem; --border: color-mix(in srgb, CanvasText 30%, transparent); }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: var(--gap); }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  textarea { width: 100%; height: 12rem; font: 14px/1.4 ui-monospace, monospace; box-sizing: border-box; }
  .row { display: flex; gap: .5rem var(--gap); flex-wrap: wrap; align-items: center; margin: var(--gap) 0; }
  .row label { display: inline-flex; gap: .4rem; align-items: center; }
  button, select { font: inherit; }
  #out { padding: var(--gap); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; min-height: 4rem; }
  #out svg { height: var(--size, 3em); width: auto; display: block; }
  /* the SVG hard-codes black; follow the page colors instead (the download keeps black) */
  #out svg [fill="black"] { fill: currentColor; }
  #out svg [stroke="black"] { stroke: currentColor; }
  #status { color: GrayText; }
  #status.error { color: crimson; }
  details { margin: var(--gap) 0; }
  #mathml { max-height: 14rem; overflow: auto; background: color-mix(in srgb, CanvasText 6%, transparent);
            padding: .5rem; border-radius: 4px; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  .group { display: inline-flex; gap: .25rem; }
  .hint { color: GrayText; font-size: .9rem; }
</style>
</head>
<body>
<h1>math-render in the browser</h1>
<p class="hint">LaTeX or MathML in, SVG out. Laid out by Rust compiled to WebAssembly, using the font's OpenType MATH table.</p>

<div class="row">
  <label>Input:
    <select id="mode">
      <option value="latex">LaTeX</option>
      <option value="mathml">MathML</option>
    </select>
  </label>
  <label id="displaylabel"><input id="display" type="checkbox" checked> display style</label>
</div>

<textarea id="src" spellcheck="false" aria-label="Formula source"></textarea>

<div class="row">
  <label>Font:
    <select id="font"></select>
  </label>
  <input id="fontfile" type="file" accept=".otf,.ttf" hidden>
  <label>Size: <input id="size" type="range" min="1" max="8" step="0.25" value="3"></label>
  <label><input id="debug" type="checkbox"> show boxes</label>
  <button id="download" type="button" disabled>Download SVG</button>
  <span class="group">
    <button id="downloadpng" type="button" disabled>Download PNG</button>
    <select id="pngscale" aria-label="PNG resolution">
      <option value="1">1× (48 px/em)</option>
      <option value="2" selected>2× (96 px/em)</option>
      <option value="4">4× (192 px/em)</option>
    </select>
  </span>
  <span id="status" role="status">loading…</span>
</div>

<div id="out" aria-live="polite"></div>

<details id="mathmldetails">
  <summary>Generated MathML</summary>
  <pre id="mathml"></pre>
</details>

<script type="module">
import init, { MathRenderer, latex_to_mathml } from "./pkg/mathwasm.js";

const FONTS = [
  { file: "latinmodern-math.otf", name: "Latin Modern Math" },
  { file: "texgyrepagella-math.otf", name: "TeX Gyre Pagella Math" },
  { file: "texgyretermes-math.otf", name: "TeX Gyre Termes Math" },
  { file: "stixtwo-math.otf", name: "STIX Two Math" },
  { file: "firamath-regular.otf", name: "Fira Math" },
  { file: "notosans-math.ttf", name: "Noto Sans Math" },
];
const CUSTOM = "custom";

const EXAMPLES = {
  latex: String.raw`x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}`,
  mathml: `<math display="block">
  <mrow>
    <mi>x</mi><mo>=</mo>
    <mfrac>
      <mrow><mo>-</mo><mi>b</mi><mo>±</mo>
        <msqrt><msup><mi>b</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>a</mi><mi>c</mi></msqrt>
      </mrow>
      <mrow><mn>2</mn><mi>a</mi></mrow>
    </mfrac>
  </mrow>
</math>`,
};
const saved = { latex: EXAMPLES.latex, mathml: EXAMPLES.mathml };

const $ = (id) => document.getElementById(id);
const renderers = new Map();   // font file -> MathRenderer
let renderer = null;           // the one in use
let fontName = "";
let currentSvg = "";
let loadToken = 0;

function status(msg, error = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", error);
}

function toMathML(source) {
  if ($("mode").value === "mathml") return source;
  return latex_to_mathml(source, $("display").checked);
}

function render() {
  if (!renderer) return;
  const source = $("src").value;
  try {
    const t0 = performance.now();
    const mathml = toMathML(source);
    $("mathml").textContent = mathml;
    currentSvg = $("debug").checked ? renderer.render_svg_debug(mathml) : renderer.render_svg(mathml);
    $("out").innerHTML = currentSvg;
    $("download").disabled = false;
    $("downloadpng").disabled = false;
    status(`${fontName} · rendered in ${(performance.now() - t0).toFixed(1)} ms`);
  } catch (e) {
    $("download").disabled = true;
    $("downloadpng").disabled = true;
    status(String(e?.message ?? e), true);
  }
}

async function selectFont(file) {
  const token = ++loadToken;
  try {
    let r = renderers.get(file);
    if (!r) {
      status("loading font…");
      const res = await fetch(`./fonts/${file}`);
      if (!res.ok) throw new Error(`could not load ${file} (HTTP ${res.status})`);
      r = new MathRenderer(new Uint8Array(await res.arrayBuffer()));
      renderers.set(file, r);
    }
    if (token !== loadToken) return;           // a newer selection won
    renderer = r;
    fontName = FONTS.find((f) => f.file === file)?.name ?? file;
    render();
  } catch (e) {
    if (token === loadToken) status(String(e?.message ?? e), true);
  }
}

function setCustomFont(bytes, name) {
  ++loadToken;
  try {
    renderer = new MathRenderer(new Uint8Array(bytes));
    fontName = name;
    render();
  } catch (e) {
    status(String(e?.message ?? e), true);
  }
}

// Wraps the rendered SVG so it can be used on its own: an absolute size and the XML
// declaration, instead of the unsized viewBox-only SVG that scales with the page.
// `pxPerEm` sets the scale; the SVG is in font units.
function standaloneSvg(pxPerEm = 48) {
  const m = currentSvg.match(/viewBox="([^"]+)"/);
  if (!m) return { svg: currentSvg, width: 0, height: 0 };
  const [, , w, h] = m[1].split(/\s+/).map(Number);
  const scale = pxPerEm / renderer.units_per_em();
  const width = w * scale, height = h * scale;
  const sized = currentSvg.replace(
    "<svg ",
    `<svg width="${width.toFixed(2)}" height="${height.toFixed(2)}" `);
  return { svg: `<?xml version="1.0" encoding="UTF-8"?>\n${sized}\n`, width, height };
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function download() {
  const { svg } = standaloneSvg();
  saveBlob(new Blob([svg], { type: "image/svg+xml" }), "formula.svg");
}

// Rasterizes the SVG with the browser: draw it onto a canvas, then export the canvas.
// The background stays transparent.
async function downloadPng() {
  const MAX_SIDE = 16000;                       // browsers refuse larger canvases
  let pxPerEm = 48 * Number($("pngscale").value);
  let { svg, width, height } = standaloneSvg(pxPerEm);
  if (Math.max(width, height) > MAX_SIDE) {
    pxPerEm *= MAX_SIDE / Math.max(width, height);
    ({ svg, width, height } = standaloneSvg(pxPerEm));
  }
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const canvas = Object.assign(document.createElement("canvas"), {
      width: Math.max(1, Math.ceil(width)),
      height: Math.max(1, Math.ceil(height)),
    });
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    const png = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    if (!png) throw new Error("the browser could not encode the PNG");
    saveBlob(png, "formula.png");
  } catch (e) {
    status(`PNG export failed: ${e?.message ?? e}`, true);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function updateMode(previous) {
  const mode = $("mode").value;
  if (previous) saved[previous] = $("src").value;
  $("src").value = saved[mode];
  $("displaylabel").hidden = mode !== "latex";
  $("mathmldetails").hidden = mode !== "latex";
}

// --- wiring ---
for (const f of FONTS) $("font").add(new Option(f.name, f.file));
const uploadOption = new Option("Upload font file…", CUSTOM);
$("font").add(uploadOption);

let lastFont = FONTS[0].file;   // what the dropdown shows if the upload dialog is cancelled
$("font").addEventListener("change", (e) => {
  if (e.target.value === CUSTOM) {
    $("fontfile").click();
  } else {
    lastFont = e.target.value;
    selectFont(lastFont);
  }
});
$("fontfile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (file) {
    uploadOption.text = `${file.name} (uploaded)`;
    $("font").value = CUSTOM;
    lastFont = CUSTOM;
    setCustomFont(await file.arrayBuffer(), file.name);
  } else {
    $("font").value = lastFont;
  }
  e.target.value = "";
});

// closing the file dialog without a choice fires `cancel` (and no `change`) in current browsers
$("fontfile").addEventListener("cancel", () => { $("font").value = lastFont; });

let currentMode = $("mode").value;
$("mode").addEventListener("change", () => { updateMode(currentMode); currentMode = $("mode").value; render(); });
$("src").addEventListener("input", render);
$("display").addEventListener("change", render);
$("debug").addEventListener("change", render);
$("download").addEventListener("click", download);
$("downloadpng").addEventListener("click", downloadPng);
$("size").addEventListener("input", (e) =>
  document.documentElement.style.setProperty("--size", `${e.target.value}em`));

await init();
updateMode(null);
selectFont(FONTS[0].file);
</script>
</body>
</html>
