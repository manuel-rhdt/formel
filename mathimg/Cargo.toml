[package]
name = "mathimg"
version = "0.1.0"
authors = ["Manuel Reinhardt <manuel.jr16@gmail.com>"]
edition = "2018"

[dependencies]
math-render = { path = "..", version = "0.1.0", features = ["mathml_parser"] }
freetype-rs = "0.11"
docopt = "0.6.86"
memmap = "0.5"
rustc-serialize = "0.3"
svg = "*"
harfbuzz_rs = { version = "3.0.1", features = ["sys"] }
fontconfig-sys = { git = "https://github.com/manuel-rhdt/fontconfig-rs" }
fontconfig = { git = "https://github.com/manuel-rhdt/fontconfig-rs" }
