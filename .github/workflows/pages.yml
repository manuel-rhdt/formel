name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `freetype-rs` is a dev-dependency (used by examples/freetype_renderer.rs), so
      # `cargo test` needs the system FreeType headers.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      # must match the `wasm-bindgen` version pinned in mathwasm/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.100

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --exclude mathimg

      - name: Build the demo
        run: web/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
