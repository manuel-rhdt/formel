name: crates.io

# Publishes the `formel` crate when a `v*` tag is pushed. Pull requests build and test the package
# that would be published, which is the only check that sees what users get from crates.io: the
# tarball without `web/`, `docs/` and `.github/`, and nothing else.
#
# Publishing needs the `CARGO_REGISTRY_TOKEN` repository secret, an API token from
# https://crates.io/settings/tokens with `publish-update` (and `publish-new` for a new crate).

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # Both packages are released from the same tag, so their versions have to agree with it and
      # with each other; otherwise the npm job and this one would ship different numbers.
      - name: Check the tag against the crate versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          wasm=$(sed -n 's/^version = "\(.*\)"$/\1/p' formel-wasm/Cargo.toml | head -1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the formel version $version" >&2
            exit 1
          fi
          if [ "$wasm" != "$version" ]; then
            echo "formel is $version but formel-wasm is $wasm; release them together" >&2
            exit 1
          fi
          echo "packaging $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: cargo package -p formel

      # Built from the extracted tarball, not from the repository: this is what `cargo test` does for
      # anyone who gets the crate from crates.io, and it is where a missing file shows up.
      - name: Test the packaged crate
        run: |
          crate=$(ls -d target/package/formel-*/ | head -1)
          echo "testing $crate"
          cargo test --manifest-path "${crate}Cargo.toml" --all-features

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if curl -fsS -A "formel release workflow (https://github.com/manuel-rhdt/formel)" \
               "https://crates.io/api/v1/crates/formel/$VERSION" >/dev/null; then
            echo "formel $VERSION is already on crates.io; re-run the build to test, not to publish"
            exit 0
          fi
          cargo publish -p formel --token "$CARGO_REGISTRY_TOKEN"
